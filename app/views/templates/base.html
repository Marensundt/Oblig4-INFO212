<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ekte Mat Online{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('shop.menu') }}">Ekte Mat</a>
    <nav>
      <a href="{{ url_for('shop.menu') }}">Menu</a>
      <a href="{{ url_for('account.index') }}">My account</a>
      <a href="{{ url_for('admin.index') }}">Admin</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Ekte Mat Online — INFO212 student project. All data is synthetic.</p>
  </footer>
</body>
</html>
