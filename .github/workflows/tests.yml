name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  # Oblig 5: the whole suite again on Neo4j. The throwaway service container runs without
  # authentication (NEO4J_AUTH=none), so no password is needed or stored.
  pytest-neo4j:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -a bolt://localhost:7687 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
    env:
      TEST_STORAGE: neo4j
      NEO4J_TEST_URI: bolt://localhost:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests on Neo4j
        run: pytest -v
